<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken board: misplaced-tag</title>
<link rel="stylesheet" href="/_kit/lofi.css">
<script src="/_kit/lofi.js"></script>
</head>
<body>
<!-- A small valid board: no errors, no warnings. -->
<wf-board name="Clean board">
  <wf-summary>Members find a tool and open its page.</wf-summary>
  <wf-problem><p>Neighbours cannot see which tools are free.</p></wf-problem>
  <wf-journey name="Find a tool" steps="home, tool"></wf-journey>

  <wf-region id="find" name="Finding a tool">
    <wf-screen id="home" device="phone" name="Home" col="1" row="1">
      <wf-header name="Tool library"></wf-header>
      <wf-search id="home-search" placeholder="Search tools"></wf-search>
      <wf-list>
        <wf-row thumb name="Cordless drill" meta="Maya Chen, 120 m"></wf-row>
        <wf-row thumb name="Step ladder" meta="Tom Okafor, 300 m"></wf-row>
      </wf-list>
      <wf-tabbar items="Home, Borrowed, Profile" active="Home"></wf-tabbar>
    </wf-screen>

    <wf-screen id="tool" device="phone" name="Tool page" col="2" row="1">
      <wf-header back name="Cordless drill"></wf-header>
      <wf-image label="photo"></wf-image>
      <p>Free this weekend.</p>
      <wf-button primary>Borrow</wf-button>
    </wf-screen>
    <wf-note for="tool">The page shows the next free days.</wf-note>
    <!-- This link sits inside the region, so the kit cannot use it. -->
    <wf-link id="tool-home" from="tool" to="home" label="back"></wf-link>
  </wf-region>

  <wf-link id="home-tool" from="home-search" to="tool" label="tap a tool"></wf-link>

  <wf-prose region="find"><p>Search first, then the tool page.</p></wf-prose>
</wf-board>
</body>
</html>
