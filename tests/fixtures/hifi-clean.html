<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool page</title>
<style>
  :root { --bg: #ffffff; --ink: #1c1c1e; --muted: #6b6b70; --line: #e2e2e4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181a; --ink: #ececee; --muted: #a0a0a6; --line: #36363a; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width: 390px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 16px; color: var(--muted); }
  button { width: 100%; height: 44px; box-sizing: border-box; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Cordless drill 18V</h1>
  <p>Maya Chen, 120 m away. Free this weekend.</p>
  <button type="button">Borrow</button>
</main>
</body>
</html>
