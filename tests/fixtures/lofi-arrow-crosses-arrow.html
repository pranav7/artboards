<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken board: arrow-crosses-arrow</title>
<link rel="stylesheet" href="/_kit/lofi.css">
<script src="/_kit/lofi.js"></script>
</head>
<body>
<!-- Two links swap rows, so one must cross the other. -->
<wf-board name="Broken board: arrow-crosses-arrow">
  <wf-journey name="First" steps="a, d"></wf-journey>
  <wf-journey name="Second" steps="c, b"></wf-journey>
  <wf-region id="r" name="Swapping">
    <wf-screen id="a" device="phone" name="Screen A" col="1" row="1">
      <wf-header name="Screen A"></wf-header>
      <p>Free this weekend.</p>
      <wf-button primary>Next</wf-button>
    </wf-screen>
    <wf-screen id="b" device="phone" name="Screen B" col="2" row="1">
      <wf-header name="Screen B"></wf-header>
      <p>Free this weekend.</p>
      <wf-button primary>Next</wf-button>
    </wf-screen>
    <wf-screen id="c" device="phone" name="Screen C" col="1" row="2">
      <wf-header name="Screen C"></wf-header>
      <p>Free this weekend.</p>
      <wf-button primary>Next</wf-button>
    </wf-screen>
    <wf-screen id="d" device="phone" name="Screen D" col="2" row="2">
      <wf-header name="Screen D"></wf-header>
      <p>Free this weekend.</p>
      <wf-button primary>Next</wf-button>
    </wf-screen>
  </wf-region>
  <wf-link id="a-d" from="a" to="d" label="down"></wf-link>
  <wf-link id="c-b" from="c" to="b" label="up"></wf-link>
  <wf-prose region="r"><p>Rows swap.</p></wf-prose>
</wf-board>
</body>
</html>
