<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breaks dead-end</title>
<link rel="stylesheet" href="/_kit/clickthrough.css">
<script src="/_kit/clickthrough.js"></script>
</head>
<body>
<ct-flow name="Breaks dead-end" width="640" height="400">
  <template ct-head>
    <style>body { margin: 0; font: 14px/1.4 sans-serif; background: #fff; } .btn { margin: 16px; }</style>
  </template>

  <ct-step id="1" name="Start">
    <ct-hint>Click <ct-control>Next</ct-control> or <ct-control>Skip</ct-control>.</ct-hint>
    <template><button class="btn" data-go="2">Next</button><button class="btn" data-go="3">Skip</button></template>
  </ct-step>

  <ct-step id="2" name="Stuck">
    <ct-hint>There is nothing to click.</ct-hint>
    <template><p>Stuck.</p></template>
  </ct-step>

  <ct-step id="3" name="Done">
    <ct-hint>This is the last step.</ct-hint>
    <template><p>Done.</p></template>
  </ct-step>
</ct-flow>
</body>
</html>
