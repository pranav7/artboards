<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken board: arrow-overlap</title>
<link rel="stylesheet" href="/_kit/lofi.css">
<script src="/_kit/lofi.js"></script>
</head>
<body>
<!-- Both links leave the decision from its right corner, so they run on top of each other before they split. -->
<wf-board name="Broken board: arrow-overlap">
  <wf-journey name="Yes" steps="free, yes"></wf-journey>
  <wf-journey name="No" steps="free, no"></wf-journey>
  <wf-region id="ask" name="Asking">
    <wf-decision id="free" name="Free?" col="1" row="1"></wf-decision>
    <wf-screen id="yes" device="phone" name="Request sent" col="2" row="1">
      <wf-header name="Request sent"></wf-header>
      <p>Free this weekend.</p>
      <wf-button primary>Next</wf-button>
    </wf-screen>
    <wf-screen id="no" device="phone" name="Pick another" col="2" row="2">
      <wf-header name="Pick another"></wf-header>
      <p>Free this weekend.</p>
      <wf-button primary>Next</wf-button>
    </wf-screen>
  </wf-region>
  <wf-link id="free-yes" from="free" to="yes" label="yes" exit="right"></wf-link>
  <wf-link id="free-no" from="free" to="no" label="no" exit="right"></wf-link>
  <wf-prose region="ask"><p>One question, two answers.</p></wf-prose>
</wf-board>
</body>
</html>
