<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken board: arrow-crosses-note</title>
<link rel="stylesheet" href="/_kit/lofi.css">
<script src="/_kit/lofi.js"></script>
</head>
<body>
<!-- The note sits between two stacked screens, in the way of the arrow that leaves the bottom of the first. -->
<wf-board name="Broken board: arrow-crosses-note">
  <wf-journey name="Find a tool" steps="home, tool"></wf-journey>
  <wf-region id="find" name="Finding a tool">
    <wf-screen id="home" device="phone" name="Home" col="1" row="1">
      <wf-header name="Home"></wf-header>
      <p>Free this weekend.</p>
      <wf-button primary>Next</wf-button>
    </wf-screen>
    <wf-note for="home">The list is sorted by walking distance.</wf-note>
    <wf-screen id="tool" device="phone" name="Tool page" col="1" row="2">
      <wf-header name="Tool page"></wf-header>
      <p>Free this weekend.</p>
      <wf-button primary>Next</wf-button>
    </wf-screen>
  </wf-region>
  <wf-link id="home-tool" from="home" to="tool" label="tap a tool"></wf-link>
  <wf-prose region="find"><p>Search first, then the tool page.</p></wf-prose>
</wf-board>
</body>
</html>
