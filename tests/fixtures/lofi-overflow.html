<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken board: overflow</title>
<link rel="stylesheet" href="/_kit/lofi.css">
<script src="/_kit/lofi.js"></script>
</head>
<body>
<!-- Too many rows for one phone screen. -->
<wf-board name="Broken board: overflow">
  <wf-summary>Members find a tool and open its page.</wf-summary>
  <wf-problem><p>Neighbours cannot see which tools are free.</p></wf-problem>
  <wf-journey name="Find a tool" steps="home, tool"></wf-journey>

  <wf-region id="find" name="Finding a tool">
    <wf-screen id="home" device="phone" name="Home" col="1" row="1">
      <wf-header name="Tool library"></wf-header>
      <wf-search id="home-search" placeholder="Search tools"></wf-search>
      <wf-list>
        <wf-row thumb name="Cordless drill" meta="Maya Chen, 120 m"></wf-row>
        <wf-row thumb name="Step ladder" meta="Tom Okafor, 300 m"></wf-row>
      </wf-list>
      <wf-tabbar items="Home, Borrowed, Profile" active="Home"></wf-tabbar>
    </wf-screen>

    <wf-screen id="tool" device="phone" name="Tool page" col="2" row="1">
      <wf-header back name="Cordless drill"></wf-header>
      <wf-image label="photo"></wf-image>
      <p>Free this weekend.</p>
      <wf-list>
      <wf-row avatar name="Neighbour 1" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 2" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 3" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 4" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 5" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 6" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 7" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 8" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 9" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 10" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 11" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 12" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 13" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 14" meta="Has a drill to lend"></wf-row>
      <wf-row avatar name="Neighbour 15" meta="Has a drill to lend"></wf-row>
      </wf-list>
      <wf-button primary>Borrow</wf-button>
    </wf-screen>
    <wf-note for="tool">The page shows the next free days.</wf-note>
  </wf-region>

  <wf-link id="home-tool" from="home-search" to="tool" label="tap a tool"></wf-link>

  <wf-prose region="find"><p>Search first, then the tool page.</p></wf-prose>
</wf-board>
</body>
</html>
