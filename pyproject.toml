[project]
name = "artboards"
version = "0.1.0"
description = "Local HTML artboards that AI coding agents draw and you review on localhost: lo-fi journey boards and hi-fi screens"
readme = "README.md"
license = "MIT"
authors = [{ name = "Pranav" }]
requires-python = ">=3.11"
dependencies = ["playwright>=1.50"]

[project.urls]
Repository = "https://github.com/pranav7/artboards"

[project.scripts]
artboards = "artboards.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artboards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
